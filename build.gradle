plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.19.0",
            "org.junit.jupiter:junit-jupiter:6.1.3")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    implementation platform("io.qameta.allure:allure-bom:3.0.0")
    testImplementation "io.qameta.allure:allure-jupiter"
    testImplementation "io.qameta.allure:allure-selenide"
    testRuntimeOnly "org.aspectj:aspectjweaver:1.9.25"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}
